name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  front:
    name: Front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jardo-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: jardo-app/package-lock.json
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: npm test
